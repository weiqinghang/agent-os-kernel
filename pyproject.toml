[project]
name = "agent-os-kernel"
version = "0.1.0"
description = "Enterprise agent OS kernel — overnight e-commerce insight POC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_os_kernel"]

[tool.uv]
package = true
