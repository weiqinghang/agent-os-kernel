[project]
name = "agent-os-kernel"
version = "0.1.0"
description = "Enterprise agent OS kernel — overnight e-commerce insight POC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_os_kernel"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-bdd>=8.1",
  "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=agent_os_kernel.tool_gateway --cov=agent_os_kernel.policy --cov=agent_os_kernel.context --cov=agent_os_kernel.main --cov=agent_os_kernel.run --cov=agent_os_kernel.session --cov=agent_os_kernel.agents --cov=agent_os_kernel.skills.insight_report --cov=agent_os_kernel.skills.return_risk_brief --cov=agent_os_kernel.skills.money_fmt --cov=agent_os_kernel.orchestrator --cov=agent_os_kernel.model_broker --cov-report=term-missing --cov-fail-under=90"
