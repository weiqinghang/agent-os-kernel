<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>洞察报告助理</title>
  <style>
    :root { --bg:#0f1419; --panel:#1a2332; --text:#e7ecf3; --muted:#8b9bb4; --accent:#3b82f6; --user:#1e3a5f; --bot:#243044; --chip:#1e293b; --chip-on:#1d4ed8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
    header { padding:12px 20px; border-bottom:1px solid #2a3548; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    header .meta { font-size:12px; color:var(--muted); }
    #msgs { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:860px; padding:12px 14px; border-radius:10px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
    .msg.user { align-self:flex-end; background:var(--user); }
    .msg.assistant { align-self:flex-start; background:var(--bot); border:1px solid #2a3548; }
    .msg .role { font-size:11px; color:var(--muted); margin-bottom:6px; }
    .msg.md h1,.msg.md h2,.msg.md h3 { margin:0.6em 0 0.3em; font-size:1.05em; }
    .msg.md p { margin:0.4em 0; }
    .msg.md code { background:#0d1117; padding:1px 5px; border-radius:4px; font-size:0.9em; }
    .composer { border-top:1px solid #2a3548; background:var(--panel); }
    .chips { display:flex; flex-wrap:wrap; gap:8px; padding:10px 20px 0; align-items:center; }
    .chip-label { font-size:11px; color:var(--muted); margin-right:4px; }
    .chip { background:var(--chip); border:1px solid #334155; color:var(--text); padding:6px 12px; border-radius:999px; font-size:12px; cursor:pointer; }
    .chip.active { background:var(--chip-on); border-color:#60a5fa; }
    .chip:hover { border-color:#60a5fa; }
    form { display:flex; gap:8px; padding:10px 20px 14px; }
    input[type=text] { flex:1; background:#0d1117; border:1px solid #2a3548; color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px; }
    button { background:var(--accent); color:#fff; border:0; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:600; }
    button.stop { background:#3f1d24; color:#fecaca; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .plan-card { align-self:flex-start; max-width:860px; background:var(--bot); border:1px solid #2a3548; border-radius:10px; padding:8px 12px 10px; font-size:13px; white-space:normal; }
    .plan-card summary { cursor:pointer; font-weight:600; list-style:none; }
    .plan-card summary::-webkit-details-marker { display:none; }
    .plan-card summary::before { content:"▸ "; color:var(--accent); }
    .plan-card[open] summary::before { content:"▾ "; }
    .plan-steps { margin:8px 0 0; padding-left:1.2em; }
    .plan-steps li { margin:2px 0; display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
    .plan-status { color:var(--muted); font-size:12px; flex:none; }
    .plan-card li[data-status="active"] .plan-status { color:#93c5fd; }
    .plan-card li[data-status="done"] .plan-status { color:#86efac; }
    .progress-strip { align-self:flex-start; display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:999px; background:var(--bot); border:1px solid #2a3548; max-width:860px; }
    .progress-breathe { width:8px; height:8px; border-radius:50%; background:#93c5fd; animation:breathe 1.2s ease-in-out infinite; }
    .progress-text { font-size:14px; }
    @keyframes breathe { 0%,100% { opacity:.35; transform:scale(.85); } 50% { opacity:1; transform:scale(1); } }
    @media (prefers-reduced-motion: reduce) { .progress-breathe { animation:none; opacity:1; } }
    nav.assistants { display:flex; gap:8px; align-items:center; }
    nav.assistants a { color:var(--muted); font-size:13px; text-decoration:none; padding:4px 8px; border-radius:999px; border:1px solid transparent; }
    nav.assistants a[aria-current="page"] { color:var(--text); border-color:#334155; }
    .debug-toggle { margin-left:auto; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:4px; user-select:none; }
    .debug-toggle[hidden] { display:none !important; }
    .hitl { margin-top:8px; }
    .hitl button { background:#22c55e; margin-right:8px; }
    .retry { margin-top:8px; }
    .retry button { background:transparent; color:#fecaca; border:1px solid #7f1d1d; font-weight:600; font-size:13px; padding:6px 12px; }
    .rebind { margin-top:8px; padding:8px 10px; background:#0d1117; border-radius:8px; border:1px solid #334155; font-size:13px; }
    .rebind button { margin-top:6px; margin-right:8px; font-size:12px; padding:6px 12px; }
    .chain { margin-top:10px; border-top:1px dashed #2a3548; padding-top:8px; font-size:12px; color:var(--muted); white-space:normal; }
    .chain summary { cursor:pointer; list-style:none; display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; user-select:none; }
    .chain summary::-webkit-details-marker { display:none; }
    .chain summary::before { content:"▾ "; color:var(--accent); }
    .chain:not([open]) summary::before { content:"▸ "; }
    .chain-title { color:var(--text); font-weight:600; font-size:12px; }
    .chain-meta { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; }
    .chain-list { margin:8px 0 0; padding:0 0 0 4px; list-style:none; }
    .chain-item { display:flex; flex-wrap:wrap; gap:6px 10px; padding:4px 0 4px 10px; border-left:2px solid #2a3548; margin-left:4px; line-height:1.4; }
    .chain-kind { font-weight:600; color:#93c5fd; min-width:4.5em; }
    .chain-item.kind-tool_call .chain-kind { color:#86efac; }
    .chain-item.kind-hitl .chain-kind { color:#fcd34d; }
    .chain-item.kind-state .chain-kind { color:#c4b5fd; }
    .chain-detail { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; color:var(--muted); }
    .empty-state { white-space:normal; }
    .empty-title { font-weight:600; margin:0 0 4px; }
    .empty-hint { color:var(--muted); font-size:13px; margin:0 0 8px; }
    .example, .evidence-link { display:inline-block; margin:4px 8px 0 0; background:transparent; color:#bfdbfe; border:1px solid #334155; font-weight:500; font-size:13px; padding:6px 10px; white-space:nowrap; }
  </style>
</head>
<body>
  <header>
    <nav class="assistants" aria-label="助手">
      <a class="assistant" href="/" data-agent="insight.report">洞察报告助理</a>
      <a class="assistant" href="/?agent=return_risk.brief" data-agent="return_risk.brief">退货风险助手</a>
    </nav>
    <h1 id="title">洞察报告助理</h1>
    <span class="meta" id="meta">时间窗 近90天</span>
    <label class="debug-toggle" for="debug-chain" hidden>
      <input id="debug-chain" type="checkbox" />
      调试
    </label>
  </header>
  <div id="msgs"></div>
  <div class="composer">
    <div class="chips" id="chips">
      <span class="chip-label">时间窗</span>
      <button type="button" class="chip active" data-tw="90" data-label="近90天" data-start="2025-07-25" data-end="2025-10-22">近90天</button>
      <button type="button" class="chip" data-tw="30" data-label="近30天" data-start="2025-09-22" data-end="2025-10-22">近30天</button>
      <button type="button" class="chip" data-tw="7" data-label="近7天" data-start="2025-10-15" data-end="2025-10-22">近7天</button>
    </div>
    <form id="f">
      <input id="inp" type="text" placeholder="描述你想看的范围或问题" autocomplete="off" />
      <button type="button" id="stop" class="stop" hidden>停止</button>
      <button type="submit" id="send">发送</button>
    </form>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
